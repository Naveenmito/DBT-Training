version: 2

sources:
  - name: globalmart
    description: a clone of snowflake tables
    database: raw
    schema: globalmart
    tables:
      - name: customers
        description: customer detail table
      - name: orders
        description: raw order table
        columns:
          - name: orderid
            description: primary key for orders
            tests:
              - unique
              - not_null
      - name: product